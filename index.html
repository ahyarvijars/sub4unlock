<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sub4Unlock • Admin Panel</title>
<style>
  :root{
    --red:#ff2b2b;
    --red2:#b30000;
    --card:rgba(20,20,25,.78);
    --line:rgba(255,255,255,.08);
    --muted:#8b8b96;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:#ececf1;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 620px at 50% -10%,#1c0606 0%,#0a0a0c 45%,#060608 100%);
    overflow-x:hidden;
  }
  canvas#particles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
  .wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:26px 16px 70px}

  .hdr{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .logo{
    width:54px;height:54px;flex:0 0 54px;border-radius:15px;
    display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:.5px;
    background:linear-gradient(135deg,var(--red),var(--red2));
    box-shadow:0 0 26px rgba(255,43,43,.45), inset 0 0 18px rgba(255,255,255,.12);
  }
  .hdr h1{margin:0;font-size:22px;letter-spacing:.4px}
  .hdr h1 span{background:linear-gradient(90deg,#ff5c5c,#ff2b2b,#8a0000);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hdr p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px;margin-bottom:20px;backdrop-filter:blur(12px);
    box-shadow:0 18px 40px rgba(0,0,0,.55);
    animation:fade .5s ease both;
  }
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card h2{
    margin:0 0 16px;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;
    color:#ff6b6b;display:flex;align-items:center;gap:9px;
  }
  .card h2::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,#ff2b2b,#7a0000)}

  label.lbl{display:block;font-size:11.5px;color:var(--muted);margin:0 0 7px;letter-spacing:.7px;text-transform:uppercase}
  input,select{
    width:100%;padding:12px 14px;border-radius:11px;font-size:14px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
    color:#fff;outline:none;transition:.2s;font-family:inherit;
  }
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#ff5c5c 50%),linear-gradient(135deg,#ff5c5c 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  input::placeholder{color:#5c5c66}
  input:focus,select:focus{border-color:rgba(255,43,43,.65);box-shadow:0 0 0 4px rgba(255,43,43,.13);background:rgba(255,255,255,.06)}
  select option{background:#141418;color:#fff}
  .row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:end}
  @media(max-width:620px){.row{grid-template-columns:1fr}}
  .gap{height:14px}

  .btn{
    border:none;border-radius:11px;padding:12px 20px;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:.2s;
    background:linear-gradient(135deg,#ff2b2b,#a80000);color:#fff;
    box-shadow:0 8px 22px rgba(255,43,43,.28);
  }
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,43,43,.45)}
  .btn:active:not(:disabled){transform:translateY(0)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);box-shadow:none;color:#dcdce4}
  .btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.11);box-shadow:none}
  .btn.small{padding:8px 13px;font-size:12px;border-radius:9px}
  .btn.full{width:100%}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  .task-list{margin-top:16px;display:flex;flex-direction:column;gap:9px;max-height:330px;overflow-y:auto;padding-right:4px}
  .task-list::-webkit-scrollbar{width:6px}
  .task-list::-webkit-scrollbar-thumb{background:rgba(255,43,43,.4);border-radius:6px}
  .task-item{
    display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
    animation:fade .3s ease both;
  }
  .task-item .u{flex:1;font-size:12.5px;color:#b9b9c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .del{
    background:rgba(255,43,43,.12);border:1px solid rgba(255,43,43,.3);color:#ff6b6b;
    width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;
    transition:.2s;flex:0 0 28px;
  }
  .del:hover{background:rgba(255,43,43,.3);color:#fff}
  .empty{text-align:center;color:#5c5c66;font-size:13px;padding:24px 0;border:1px dashed rgba(255,255,255,.1);border-radius:12px}

  .badge{
    font-size:9.5px;font-weight:800;letter-spacing:.9px;padding:4px 8px;border-radius:6px;
    text-transform:uppercase;white-space:nowrap;flex:0 0 auto;
  }
  .badge.subscribe{background:rgba(255,43,43,.15);color:#ff5c5c;border:1px solid rgba(255,43,43,.35)}
  .badge.like{background:rgba(255,150,0,.13);color:#ffab3c;border:1px solid rgba(255,150,0,.3)}
  .badge.telegram{background:rgba(0,136,204,.15);color:#33aadd;border:1px solid rgba(0,136,204,.35)}

  .result{
    margin-top:16px;padding:16px;border-radius:13px;
    background:linear-gradient(135deg,rgba(255,43,43,.1),rgba(255,43,43,.03));
    border:1px solid rgba(255,43,43,.3);display:none;animation:fade .35s ease both;
  }
  .result.show{display:block}
  .result .lbl2{font-size:10.5px;letter-spacing:1.2px;color:#ff7b7b;text-transform:uppercase;margin-bottom:8px}
  .link-box{
    display:flex;gap:9px;align-items:center;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 12px;
  }
  .link-box code{
    flex:1;font-size:12px;color:#9fe6b0;word-break:break-all;
    font-family:ui-monospace,Consolas,monospace;
  }

  .saved{display:flex;flex-direction:column;gap:11px}
  .saved-item{
    background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.075);
    border-radius:13px;padding:13px 14px;animation:fade .3s ease both;
  }
  .saved-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .saved-id{font-family:ui-monospace,monospace;font-size:11.5px;color:#ff8080;background:rgba(255,43,43,.1);
    padding:3px 8px;border-radius:6px;border:1px solid rgba(255,43,43,.22)}
  .saved-meta{font-size:11px;color:#6e6e7a;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
  .saved-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);
    background:rgba(28,28,34,.96);border:1px solid rgba(255,43,43,.4);
    color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;z-index:99;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.4);box-shadow:0 12px 34px rgba(0,0,0,.6);
    max-width:90vw;text-align:center;
  }
  #toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="wrap">
  <header class="hdr">
    <div class="logo">S4U</div>
    <div>
      <h1>SUB<span>4</span>UNLOCK — Admin</h1>
      <p>Buat link unlock • Subscribe, Like & Telegram</p>
    </div>
  </header>

  <div class="card">
    <h2>Buat Task Baru</h2>

    <div class="row">
      <div>
        <label class="lbl">Tipe Task</label>
        <select id="taskType">
          <option value="subscribe">🔔 Subscribe Channel</option>
          <option value="subscribe_bell">🔔 Subscribe + Bell</option>
          <option value="like">👍 Like Video</option>
          <option value="telegram">📨 Join Telegram</option>
        </select>
      </div>
      <div>
        <label class="lbl">URL Target</label>
        <input id="taskUrl" type="text" placeholder="https://youtube.com/... atau https://t.me/..." />
      </div>
    </div>

    <div class="btn-row">
      <button class="btn ghost" id="addTask">＋ Tambah Task</button>
      <button class="btn ghost" id="clearTasks">🗑 Bersihkan</button>
    </div>

    <div class="task-list" id="taskList"></div>

    <div class="gap"></div>
    <div>
      <label class="lbl">Link Download (Akan terbuka setelah semua task selesai)</label>
      <input id="downloadUrl" type="text" placeholder="https://link-download-anda.com" />
    </div>

    <div class="btn-row">
      <button class="btn full" id="generate">🚀 Generate Link Unlock</button>
    </div>

    <div class="result" id="result">
      <div class="lbl2">Link Unlock Berhasil Dibuat</div>
      <div class="link-box">
        <code id="resultUrl"></code>
        <button class="btn small" id="copyResult">Copy</button>
      </div>
      <div class="btn-row">
        <button class="btn small ghost" id="openResult">Buka Link</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Link Tersimpan</h2>
    <div class="saved" id="savedList">
      <div class="empty">Memuat data…</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyADnkuT0a1bQ2jThXgjHxcD2P6unaTTTwo",
  authDomain: "sub4unlock-a5ea1.firebaseapp.com",
  databaseURL: "https://sub4unlock-a5ea1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sub4unlock-a5ea1",
  storageBucket: "sub4unlock-a5ea1.firebasestorage.app",
  messagingSenderId: "822076326275",
  appId: "1:822076326275:web:db9cff5322e7d9de45b6b6",
  measurementId: "G-X3W56VK5T9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================= PARTICLE BG ================= */
(function(){
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let W, H, P = [];
  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  const COUNT = Math.min(80, Math.max(30, Math.floor(innerWidth / 20)));
  for (let i = 0; i < COUNT; i++){
    P.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45, r: Math.random() * 1.7 + .6 });
  }
  function loop(){
    ctx.clearRect(0, 0, W, H);
    for (const p of P){
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,70,70,.75)'; ctx.fill();
    }
    for (let i = 0; i < P.length; i++){
      for (let j = i + 1; j < P.length; j++){
        const a = P[i], b = P[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 130){
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = 'rgba(255,45,45,' + (0.16 * (1 - d / 130)) + ')';
          ctx.lineWidth = 1; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function baseUrl(){ return location.href.substring(0, location.href.lastIndexOf('/') + 1); }
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function isValidUrl(url){
  return /^(https?:\/\/)?([\w\-]+\.)+[\w\-]+(\/[\w\-._~:/?#[\]@!$&'()*+,;=]*)?$/i.test(url);
}

/* ================= TASK BUILDER ================= */
let tasks = [];

function renderTasks(){
  const el = $('taskList');
  if (!tasks.length){
    el.innerHTML = '<div class="empty">Belum ada task. Tambahkan minimal 1 task di atas.</div>';
    return;
  }
  el.innerHTML = tasks.map((t, i) => `
    <div class="task-item">
      <span class="badge ${t.type}">${t.type.replace('_', ' ')}</span>
      <span class="u" title="${esc(t.url)}">${esc(t.url)}</span>
      <button class="del" data-i="${i}" title="Hapus">✕</button>
    </div>
  `).join('');

  el.querySelectorAll('.del').forEach(b => {
    b.onclick = () => { tasks.splice(+b.dataset.i, 1); renderTasks(); };
  });
}
renderTasks();

$('addTask').onclick = () => {
  const type = $('taskType').value;
  const url = $('taskUrl').value.trim();
  if (!url) return toast('Masukkan URL terlebih dahulu');
  if (!isValidUrl(url)) return toast('URL tidak valid');
  tasks.push({ type, url });
  $('taskUrl').value = '';
  $('taskUrl').focus();
  renderTasks();
  toast('Task ditambahkan (' + tasks.length + ' total)');
};
$('taskUrl').addEventListener('keydown', e => { if (e.key === 'Enter') $('addTask').click(); });
$('clearTasks').onclick = () => {
  if (!tasks.length) return;
  tasks = []; renderTasks(); toast('Semua task dibersihkan');
};

/* ================= GENERATE LINK ================= */
$('generate').onclick = async () => {
  if (!tasks.length) return toast('Tambahkan minimal 1 task');
  
  const dlUrl = $('downloadUrl').value.trim();
  if (!dlUrl) return toast('Masukkan Link Download terlebih dahulu');
  if (!isValidUrl(dlUrl)) return toast('Link Download tidak valid');

  const btn = $('generate');
  btn.disabled = true;
  btn.textContent = '⏳ Membuat link…';
  try {
    const ref = db.ref('links').push();
    await ref.set({
      createdAt: Date.now(),
      tasks: tasks,
      downloadUrl: dlUrl
    });
    const url = baseUrl() + 'User.html?id=' + ref.key;

    $('resultUrl').textContent = url;
    $('result').classList.add('show');

    $('copyResult').onclick = () => {
      navigator.clipboard.writeText(url).then(() => toast('Link disalin ✓'), () => toast('Gagal menyalin'));
    };
    $('openResult').onclick = () => window.open(url, '_blank');

    toast('Link berhasil dibuat ✓');
  } catch (e) {
    toast('Gagal: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = '🚀 Generate Link Unlock';
};

/* ================= SAVED LINKS ================= */
db.ref('links').on('value', snap => {
  const box = $('savedList');
  const data = snap.val();
  if (!data){
    box.innerHTML = '<div class="empty">Belum ada link yang dibuat.</div>';
    return;
  }
  const keys = Object.keys(data).sort((a, b) => (data[b].createdAt || 0) - (data[a].createdAt || 0));

  box.innerHTML = keys.map(k => {
    const item = data[k] || {};
    const tks = Array.isArray(item.tasks) ? item.tasks : [];
    const date = item.createdAt ? new Date(item.createdAt).toLocaleString('id-ID') : '-';
    const url = baseUrl() + 'User.html?id=' + k;
    return `
      <div class="saved-item">
        <div class="saved-top">
          <span class="saved-id">${esc(k)}</span>
          <span class="badge ${tks.length ? 'subscribe' : 'like'}">${tks.length} Task</span>
        </div>
        <div class="saved-meta">
          <span>🕒 ${esc(date)}</span>
          <span>🔗 ${esc(url.replace(baseUrl(), '…/'))}</span>
          <span>📥 ${esc(item.downloadUrl || '-')}</span>
        </div>
        <div class="saved-actions">
          <button class="btn small" data-copy="${esc(url)}">Copy Link</button>
          <button class="btn small ghost" data-open="${esc(url)}">Buka</button>
          <button class="btn small ghost" data-del="${esc(k)}" style="color:#ff6b6b;border-color:rgba(255,43,43,.35)">Hapus</button>
        </div>
      </div>`;
  }).join('');

  box.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Link disalin ✓'), () => toast('Gagal menyalin'));
  });
  box.querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => window.open(b.dataset.open, '_blank');
  });
  box.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Hapus link ini secara permanen?')) return;
      try { await db.ref('links/' + b.dataset.del).remove(); toast('Link dihapus'); }
      catch (e) { toast('Gagal: ' + e.message); }
    };
  });
}, err => {
  $('savedList').innerHTML = '<div class="empty">Gagal memuat: ' + esc(err.message) + '</div>';
});
</script>
</body>
</html>
